services:
  db:
    image: pgvector/pgvector:pg16
    container_name: konteks_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: konteks_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d konteks_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: konteks_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: konteks_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TIMEZONE: Asia/Jakarta
      EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    volumes:
      - ./data:/app/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "(alembic upgrade head || alembic stamp head) &&
             python scripts/seed_database.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: konteks_frontend
    restart: unless-stopped
    ports:
      - "3001:80"

  nginx:
    image: nginx:alpine
    container_name: konteks_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
